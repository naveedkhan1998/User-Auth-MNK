<li class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-neutral-500 dark:text-neutral-400">
  {% if not active and url %}
    <a href="{{ url }}" class="inline-flex items-center gap-2 rounded-lg px-2 py-1 text-neutral-600 transition hover:text-primary-600 dark:text-neutral-300 dark:hover:text-primary-400">
      {{ label }}
    </a>
  {% else %}
    <span class="inline-flex items-center gap-2 text-primary-600 dark:text-primary-400">
      {{ label }}
    </span>
  {% endif %}
</li>
