{% if 'error' in message.tags %}
  <div class="flex items-start gap-3 rounded-2xl border border-red-400/60 bg-red-50 px-4 py-3 shadow-sm dark:border-red-500/60 dark:bg-red-950/70" role="alert">
    <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-red-600 dark:text-red-400" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
    </svg>
    <p class="text-sm text-red-700 dark:text-red-200">{{ message }}</p>
  </div>
{% elif 'warning' in message.tags %}
  <div class="flex items-start gap-3 rounded-2xl border border-amber-400/60 bg-amber-50 px-4 py-3 shadow-sm dark:border-amber-500/60 dark:bg-amber-950/70" role="alert">
    <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-amber-600 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
    </svg>
    <p class="text-sm text-amber-700 dark:text-amber-200">{{ message }}</p>
  </div>
{% elif 'success' in message.tags %}
  <div class="flex items-start gap-3 rounded-2xl border border-emerald-400/60 bg-emerald-50 px-4 py-3 shadow-sm dark:border-emerald-500/60 dark:bg-emerald-950/70" role="alert">
    <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-emerald-600 dark:text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
    </svg>
    <p class="text-sm text-emerald-700 dark:text-emerald-200">{{ message }}</p>
  </div>
{% else %}
  <div class="flex items-start gap-3 rounded-2xl border border-slate-200/70 bg-white/80 px-4 py-3 shadow-sm dark:border-slate-700/60 dark:bg-slate-900/80" role="alert">
    <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-slate-600 dark:text-slate-400" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
    </svg>
    <p class="text-sm text-slate-700 dark:text-slate-200">{{ message }}</p>
  </div>
{% endif %}
