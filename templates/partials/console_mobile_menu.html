{% if request.user.is_authenticated and request.user.is_staff %}
  <div id="mobile-menu" class="hidden border-t border-neutral-200 bg-white lg:hidden dark:border-neutral-800 dark:bg-neutral-950">
    <nav class="mx-auto space-y-1 px-4 py-4" aria-label="Console navigation (mobile)">
      <a
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold transition-all duration-200 {% if request.resolver_match.url_name == 'file-manager' %}bg-primary-50 text-primary-700 dark:bg-primary-950/50 dark:text-primary-400{% else %}text-neutral-700 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-900{% endif %}"
        href="{% url 'console:file-manager' %}"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        Files
      </a>
      <a
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold transition-all duration-200 {% if 'project' in request.resolver_match.url_name %}bg-primary-50 text-primary-700 dark:bg-primary-950/50 dark:text-primary-400{% else %}text-neutral-700 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-900{% endif %}"
        href="{% url 'console:project-list' %}"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          />
        </svg>
        Projects
      </a>
      <a
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold transition-all duration-200 {% if 'message' in request.resolver_match.url_name %}bg-primary-50 text-primary-700 dark:bg-primary-950/50 dark:text-primary-400{% else %}text-neutral-700 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-900{% endif %}"
        href="{% url 'console:message-list' %}"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Messages
      </a>
      <a
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold transition-all duration-200 {% if 'blog' in request.resolver_match.url_name %}bg-primary-50 text-primary-700 dark:bg-primary-950/50 dark:text-primary-400{% else %}text-neutral-700 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-900{% endif %}"
        href="{% url 'console:blog-post-list' %}"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
        Blog
      </a>
      <a
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-neutral-700 transition-all duration-200 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-900"
        href="{% url 'admin:index' %}"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Admin
      </a>

      <div class="mt-4 space-y-3 border-t border-neutral-200 pt-4 dark:border-neutral-800">
        <div class="flex items-center gap-3 rounded-lg bg-neutral-50 px-4 py-3 dark:bg-neutral-900">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-600 text-sm font-bold text-white dark:bg-primary-500">{{ request.user.name|first|upper }}</div>
          <div class="flex flex-col">
            <span class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">{{ request.user.name }}</span>
            <span class="text-xs text-neutral-500 dark:text-neutral-400">{{ request.user.email }}</span>
          </div>
        </div>
        <form method="post" action="{% url 'console:logout' %}" class="m-0">
          {% csrf_token %}
          <button
            type="submit"
            class="flex w-full items-center justify-center gap-2 rounded-lg border border-neutral-200 px-4 py-2.5 text-sm font-semibold text-neutral-700 transition-all duration-200 hover:border-neutral-300 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-300 dark:hover:border-neutral-600 dark:hover:bg-neutral-800"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Sign out
          </button>
        </form>
      </div>
    </nav>
  </div>

  <script>
    const mobileMenuToggle = document.getElementById("mobile-menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");
    const menuIcon = document.getElementById("menu-icon");
    const closeIcon = document.getElementById("close-icon");

    if (mobileMenuToggle && mobileMenu) {
      mobileMenuToggle.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");

        if (isOpen) {
          mobileMenu.classList.add("hidden");
          menuIcon.classList.remove("hidden");
          closeIcon.classList.add("hidden");
        } else {
          mobileMenu.classList.remove("hidden");
          menuIcon.classList.add("hidden");
          closeIcon.classList.remove("hidden");
        }
      });

      const mobileLinks = mobileMenu.querySelectorAll("a");
      mobileLinks.forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
          menuIcon.classList.remove("hidden");
          closeIcon.classList.add("hidden");
        });
      });
    }
  </script>
{% endif %}
