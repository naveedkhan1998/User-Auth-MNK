{% if request.user.is_authenticated and request.user.is_staff %}
  <nav class="hidden items-center gap-0.5 lg:flex" aria-label="Console navigation">
    <a
      class="group relative rounded-lg px-4 py-2.5 text-sm font-semibold transition-all duration-200 {% if request.resolver_match.url_name == 'file-manager' %}text-primary-700 bg-primary-50 dark:text-primary-400 dark:bg-primary-950/50{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:text-neutral-100 dark:hover:bg-neutral-900{% endif %}"
      href="{% url 'console:file-manager' %}"
    >
      <span class="relative z-10 flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        Files
      </span>
    </a>
    <a
      class="group relative rounded-lg px-4 py-2.5 text-sm font-semibold transition-all duration-200 {% if 'project' in request.resolver_match.url_name %}text-primary-700 bg-primary-50 dark:text-primary-400 dark:bg-primary-950/50{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:text-neutral-100 dark:hover:bg-neutral-900{% endif %}"
      href="{% url 'console:project-list' %}"
    >
      <span class="relative z-10 flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          />
        </svg>
        Projects
      </span>
    </a>
    <a
      class="group relative rounded-lg px-4 py-2.5 text-sm font-semibold transition-all duration-200 {% if 'message' in request.resolver_match.url_name %}text-primary-700 bg-primary-50 dark:text-primary-400 dark:bg-primary-950/50{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:text-neutral-100 dark:hover:bg-neutral-900{% endif %}"
      href="{% url 'console:message-list' %}"
    >
      <span class="relative z-10 flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Messages
      </span>
    </a>
    <a
      class="group relative rounded-lg px-4 py-2.5 text-sm font-semibold transition-all duration-200 {% if 'blog' in request.resolver_match.url_name %}text-primary-700 bg-primary-50 dark:text-primary-400 dark:bg-primary-950/50{% else %}text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:text-neutral-100 dark:hover:bg-neutral-900{% endif %}"
      href="{% url 'console:blog-post-list' %}"
    >
      <span class="relative z-10 flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
        Blog
      </span>
    </a>
    <a
      class="group relative rounded-lg px-4 py-2.5 text-sm font-semibold text-neutral-700 transition-all duration-200 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:text-neutral-100 dark:hover:bg-neutral-900"
      href="{% url 'admin:index' %}"
    >
      <span class="relative z-10 flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"

          />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Admin
      </span>
    </a>
  </nav>
{% endif %}
